<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages tidak melakukan rewrite SPA secara otomatis.
      // Halaman ini menangkap 404 dan mengarahkan ke index.html
      // sambil menyimpan path asli agar route dipulihkan di main.tsx.
      sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
      location.replace('./index.html');
    </script>
  </head>
  <body></body>
</html>
