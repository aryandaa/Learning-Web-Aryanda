name: Sync docs from Obsidian vault

on:
  repository_dispatch:
    types: [vault-sync]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Repository/branch/commit dari payload repository_dispatch yang dikirim
      # Obsidian-Vault (vaultCommit/vaultBranch). Fallback snake_case untuk
      # kompatibilitas, dan default hanya untuk workflow_dispatch manual.
      VAULT_REPO_URL: ${{ github.event.client_payload.repo_clone_url || github.event.client_payload.repoCloneUrl || 'https://github.com/aryandaa/Obsidian-Vault.git' }}
      VAULT_COMMIT: ${{ github.event.client_payload.vaultCommit || github.event.client_payload.vault_commit || '' }}
      VAULT_BRANCH: ${{ github.event.client_payload.vaultBranch || github.event.client_payload.vault_branch || 'main' }}
      # Token Fine-grained PAT, Contents: Read-only ke aryandaa/Obsidian-Vault.
      # Hanya dipakai di dalam run script — tidak pernah di-echo ke log.
      OBSIDIAN_VAULT_TOKEN: ${{ secrets.OBSIDIAN_VAULT_TOKEN }}

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clone vault (pinned to dispatch commit, authenticated)
        run: |
          set -euo pipefail
          rm -rf /tmp/vault-clone

          # Bangun URL ber-autentikasi hanya untuk github.com. URL yang berisi
          # token tidak pernah dicetak; GitHub Actions juga otomatis mem-mask
          # nilai secret di log sebagai lapisan pengaman kedua.
          case "$VAULT_REPO_URL" in
            https://github.com/*)
              AUTH_URL="https://x-access-token:${OBSIDIAN_VAULT_TOKEN}@github.com/${VAULT_REPO_URL#https://github.com/}"
              ;;
            *)
              AUTH_URL="$VAULT_REPO_URL"
              ;;
          esac

          git init -q /tmp/vault-clone
          cd /tmp/vault-clone
          git remote add origin "$AUTH_URL"

          if [ -n "$VAULT_COMMIT" ]; then
            # Proses persis commit dari payload (vaultCommit) — bukan HEAD main.
            # Gagal keras kalau commit tidak bisa di-fetch, sehingga parser
            # tidak pernah memproses versi vault yang salah.
            git fetch --depth 1 --no-tags origin "$VAULT_COMMIT"
            git checkout --detach FETCH_HEAD
            echo "Vault pinned to commit: ${VAULT_COMMIT}"
          else
            # Fallback workflow_dispatch manual: pin HEAD branch ke SHA-nya.
            git fetch --depth 1 --no-tags origin "$VAULT_BRANCH"
            git checkout --detach FETCH_HEAD
            echo "VAULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "Vault pinned to branch HEAD: $(git rev-parse HEAD)"
          fi

      - name: Parse vault into generated site data
        run: npm run parse -- --vault /tmp/vault-clone --commit="${{ env.VAULT_COMMIT }}" --branch="${{ env.VAULT_BRANCH }}"

      - name: Validate generated output
        run: |
          test -f generated/docs/tree.json
          test -f generated/docs/search-index.json
          test -f generated/docs/metadata.json
          test -f generated/warnings.json
          test -d generated/assets
          test -f public/docs/tree.json
          test -f public/docs/warnings.json
          test -f public/assets/vault/manifest.json
          node -e "const m=require('./public/docs/metadata.json'); if(!m.totalNotes) { console.error('metadata.totalNotes kosong'); process.exit(1); } console.log('notes:', m.totalNotes)"

      - name: Safety check — no markdown may reach the public output
        run: |
          MD_IN_DOCS=$(find public/docs -name '*.md' | wc -l)
          MD_IN_ASSETS=$(find public/assets/vault -name '*.md' | wc -l)
          echo "markdown di public/docs: $MD_IN_DOCS"
          echo "markdown di public/assets/vault: $MD_IN_ASSETS"
          [ "$MD_IN_DOCS" -eq 0 ] && [ "$MD_IN_ASSETS" -eq 0 ] || { echo "SAFETY FAIL: markdown bocor ke public output"; exit 1; }

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated public
          if ! git diff --cached --quiet; then
            git commit -m "sync: update generated docs from vault ${GITHUB_SHA}"
            git push
          else
            echo "No generated changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary vault clone
        if: always()
        run: rm -rf /tmp/vault-clone
