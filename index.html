<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeLearn · personal learning platform · materi dari Obsidian Vault Aryanda" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>CodeLearn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema tersimpan sebelum paint agar tidak ada flash tema salah.
      // Light adalah tema utama; dark hanya alternative. Key div-version kan
      // agar semua pengunjung mendapat light default setelah visual refresh.
      (function () {
        try {
          if (window.localStorage.getItem('lw-theme-v2') === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <script>
      // Deteksi root aplikasi sebelum asset dimuat, agar situs aman di root
      // maupun subpath (GitHub Pages). Route: /, /docs, /docs/*, /search,
      // /graph, /roadmap, /editor, /cysec-tools, /cysec-tools/*, /osint, /osint/*.
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var root = '/';
        var known = function (p) { return p === 'docs' || p === 'search' || p === 'graph' || p === 'roadmap' || p === 'editor' || p === 'cysec-tools' || p === 'osint'; };
        if (parts.length === 0) {
          root = '/';
        } else if (known(parts[0])) {
          root = '/';
        } else {
          var i = parts.findIndex(known);
          root = i === -1
            ? window.location.pathname.replace(/\/?$/, '/')
            : '/' + parts.slice(0, i).join('/') + '/';
        }
        document.write('<base href="' + root + '">');
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/asset/logo%20web.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
