<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal learning platform · materi dari Obsidian Vault Aryanda" />
    <meta name="theme-color" content="#020617" />
    <title>Learning Web Aryanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema tersimpan sebelum paint agar tidak ada flash tema salah.
      (function () {
        try {
          if (window.localStorage.getItem('lw-theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Deteksi root aplikasi sebelum asset dimuat, agar situs aman di root
      // maupun subpath (GitHub Pages). Route: /, /docs, /docs/*, /search,
      // /graph, /roadmap, /editor.
      (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var root = '/';
        if (parts.length === 0) {
          root = '/';
        } else if (parts[0] === 'docs' || parts[0] === 'search' || parts[0] === 'graph' || parts[0] === 'roadmap' || parts[0] === 'editor') {
          root = '/';
        } else {
          var i = parts.findIndex(function (p) { return p === 'docs' || p === 'search' || p === 'graph' || p === 'roadmap' || p === 'editor'; });
          root = i === -1
            ? window.location.pathname.replace(/\/?$/, '/')
            : '/' + parts.slice(0, i).join('/') + '/';
        }
        document.write('<base href="' + root + '">');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
